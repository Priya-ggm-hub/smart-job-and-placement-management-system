# ==========================================================
# Smart Job & Placement Management System Configuration
# ==========================================================
spring.application.name=placement-management-system
server.port=8080

# ----------------------------------------------------------
# Database Configuration (Supports Railway MySQL, Spring Boot standard, and custom DB_* env vars)
# ----------------------------------------------------------
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:placement_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:${SPRING_DATASOURCE_USERNAME:root}}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:${SPRING_DATASOURCE_PASSWORD:root123}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ----------------------------------------------------------
# File Upload Configuration (Resume PDFs & Bulk CSV/Excel)
# ----------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads/resumes}

# ----------------------------------------------------------
# JWT Security Configuration
# ----------------------------------------------------------
# 256-bit secret key for HMAC-SHA256 signature
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 Hours validity (in milliseconds = 86400000)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ----------------------------------------------------------
# Email (SMTP) Configuration
# ----------------------------------------------------------
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}

# Logging
logging.level.com.placement=INFO
logging.level.org.springframework.security=WARN
